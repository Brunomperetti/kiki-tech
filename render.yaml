services:
  - type: web
    name: kiki-tech-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: kiki-tech-db, property: connectionString}
      - key: CORS_ORIGINS
        sync: false
      - key: KIKI_ADMIN_USERNAME
        sync: false
      - key: KIKI_ADMIN_PASSWORD_HASH
        sync: false
      - key: APP_SESSION_SECRET
        sync: false
      - key: APP_ENCRYPTION_KEY
        sync: false
      - key: SESSION_TTL_HOURS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AUTH_MAX_ATTEMPTS
        sync: false
      - key: AUTH_WINDOW_MINUTES
        sync: false
      - key: AUTH_BLOCK_MINUTES
        sync: false
      - key: ENABLE_API_DOCS
        value: "false"
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      - key: ML_REDIRECT_URI
        sync: false
  - type: web
    name: kiki-tech-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: kiki-tech-db
    plan: free
