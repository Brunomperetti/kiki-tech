services:
  - type: web
    name: kiki-tech-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: kiki-tech-db, property: connectionString}
      - key: CORS_ORIGINS
        sync: false
  - type: web
    name: kiki-tech-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
databases:
  - name: kiki-tech-db
    plan: free
