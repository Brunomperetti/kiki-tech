name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Verify the actual /v2/ bundle published by KIKI on Render.
      - run: npm run build:production
      - run: test -f .production-dist/index.html

  documental-schema-sandbox:
    runs-on: ubuntu-latest
    # Disposable PostgreSQL 18. No Render database, production data or providers.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: kiki_ci_synthetic
          POSTGRES_USER: kiki_ci
          POSTGRES_PASSWORD: synthetic_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kiki_ci -d kiki_ci_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'psycopg[binary]==3.2.3' 'sqlalchemy==2.0.36'
      - name: Check migration safety on an ephemeral database
        working-directory: backend
        env:
          KIKI_CI_SYNTHETIC_ONLY: "1"
        run: python -m integration_sandbox.ci_migration_smoke
      - name: Test opt-in startup migration against disposable PG18
        working-directory: backend
        env:
          KIKI_CI_SYNTHETIC_ONLY: "1"
        run: python -m integration_sandbox.ci_one_time_bootstrap_smoke
      - name: Verify source-intake migration and rollback in disposable PG18
        working-directory: backend
        env:
          KIKI_CI_SYNTHETIC_ONLY: "1"
        run: python -m integration_sandbox.ci_source_intake_smoke

  production-supervisor-no-cap-kill:
    runs-on: ubuntu-latest
    # Test the actual Render Dockerfile with no external network at runtime,
    # no CAP_KILL, no secrets and only a disposable SQLite database.
    steps:
      - uses: actions/checkout@v4
      - name: Build actual production image
        run: docker build --tag kiki-supervisor-shutdown:ci --file backend/Dockerfile backend
      - name: Start and stop isolated API+reader without CAP_KILL
        run: python integration/ci_supervisor_docker_smoke.py
